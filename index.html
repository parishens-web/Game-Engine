<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8a3d">
  <title>ร้านอร่อยไอเดิล</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="stat money" title="เงิน">
      <span class="icon">💰</span><span id="money">0</span>
    </div>
    <div class="stat rate" title="รายได้อัตโนมัติต่อวินาที">
      <span id="rate">0</span>/วิ
    </div>
    <div class="stat stars" title="ดาว (โบนัสรายได้)">
      <span class="icon">⭐</span><span id="stars">0</span>
    </div>
  </header>

  <main>
    <section id="tab-shop" class="tab active">
      <div class="toolbar">
        <h1 id="branch-name">สาขา 1</h1>
        <button id="buy-mult" class="chip">ซื้อ x1</button>
      </div>
      <div id="stations" class="stations"></div>
    </section>

    <section id="tab-upgrades" class="tab">
      <h1>อัปเกรดร้าน</h1>
      <div id="upgrades" class="upgrades"></div>
    </section>

    <section id="tab-prestige" class="tab">
      <h1>ขยายสาขา</h1>
      <div class="card prestige-card">
        <p>ขายร้านนี้แล้วไปเปิดสาขาใหม่ เงิน ระดับเมนู และอัปเกรดร้านจะเริ่มใหม่ทั้งหมด แต่ได้ <b>⭐ ดาว</b> ติดตัวไปด้วย</p>
        <p>ดาวแต่ละดวงเพิ่มรายได้ <b>+10%</b> ถาวร</p>
        <p class="muted">ต้องมีรายได้ในสาขานี้รวม <b id="prestige-req"></b> ขึ้นไป</p>
        <p>รายได้สาขานี้: <b id="run-earned">0</b></p>
        <p>จะได้รับ: <b id="prestige-gain">0</b> ⭐</p>
        <button id="prestige-btn" class="btn big">เปิดสาขาใหม่</button>
      </div>
      <div class="card">
        <button id="reset-btn" class="btn danger">ลบเซฟทั้งหมด</button>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="shop" class="active">🍽️<span>ร้าน</span></button>
    <button data-tab="upgrades">⬆️<span>อัปเกรด</span></button>
    <button data-tab="prestige">⭐<span>สาขา</span></button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div id="modal-text"></div>
      <button id="modal-ok" class="btn big">ตกลง</button>
    </div>
  </div>

  <div id="fx"></div>
  <script src="game.js"></script>
</body>
</html>
